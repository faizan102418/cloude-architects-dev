
name: CI - Validate Website

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-site:
    name: Validate website files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required website files
        run: |
          set -e

          for file in site/index.html site/style.css; do
            if [ ! -f "$file" ]; then
              echo "ERROR: $file does not exist."
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty."
              exit 1
            fi

            echo "PASS: $file exists and is not empty."
          done

          echo "SUCCESS: Website validation passed."
